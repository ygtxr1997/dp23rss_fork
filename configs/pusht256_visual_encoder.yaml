_target_: diffusion_policy.workspace.train_visual_encoder_pretrain_workspace.TrainVisualEncoderPretrainWorkspace

name: train_visual_encoder_pretrain
task_name: pusht256
exp_name: default

horizon: 10
n_obs_steps: 2
n_action_steps: 8

image_shape: &image_shape [3, 256, 256]
shape_meta: &shape_meta
  obs:
    image:
      shape: *image_shape
      type: rgb
    agent_pos:
      shape: [2]
      type: low_dim
    all_state:  # added for state prediction pretraining, ori:not exist
        shape: [5]
        type: low_dim
  action:
    shape: [2]

policy:
  _target_: diffusion_policy.policy.visual_encoder_pretrain_policy.VisualEncoderPretrainPolicy
  shape_meta: ${shape_meta}
  horizon: ${horizon}
  n_obs_steps: ${n_obs_steps}
  crop_shape: [240, 240]
  obs_encoder_group_norm: true
  eval_fixed_crop: true
  regressor_hidden_dim: 256
  regressor_dropout: 0.0
  agent_pos_loss_weight: 1.0
  action_loss_weight: 1.0
  state_target_key: all_state

task:
  dataset:
    _target_: diffusion_policy.dataset.pusht_image_dataset.MergedPushTImageDataset
    shape_meta: ${shape_meta}
    horizon: ${horizon}
    pad_before: ${eval:'${n_obs_steps}-1'}
    pad_after: ${eval:'${n_action_steps}-1'}
    seed: 42
    val_ratio: 0.01
    max_train_episodes: 90
    transform_color_jitter: true
    return_all_state: true  # ori:false
    zarr_paths:
      - data/pusht/pusht_256.zarr
      - data/pusht/pusht_256_texture.zarr
      - data/pusht/pusht_256_light.zarr
      - data/pusht/pusht_256_goal.zarr
      - data/pusht/pusht_256_block.zarr

dataloader:
  batch_size: 128
  num_workers: 12
  shuffle: true
  pin_memory: true
  persistent_workers: false

val_dataloader:
  batch_size: 64
  num_workers: 8
  shuffle: false
  pin_memory: true
  persistent_workers: false

optimizer:
  obs_encoder_weight_decay: 0.01
  regressor_weight_decay: 0.01
  learning_rate: 0.0001
  betas: [0.9, 0.95]

ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

training:
  device: cuda:0
  seed: 42
  debug: false
  resume: true
  lr_scheduler: cosine
  lr_warmup_steps: 200
  num_epochs: 200
  gradient_accumulate_every: 1
  use_ema: true
  val_every: 10
  checkpoint_every: 10
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0

checkpoint:
  save_last_ckpt: true
  save_last_snapshot: false
  topk:
    monitor_key: val_loss
    mode: min
    k: 5
    format_str: epoch={epoch:04d}-val_loss={val_loss:.6f}.ckpt

logging:
  project: diffusion_policy_debug
  resume: true
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "${exp_name}"]
  id: null
  group: null

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
