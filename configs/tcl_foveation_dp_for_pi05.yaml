# DP TCL source model whose routing branches are transferred to Pi0.5.
defaults:
  - tcl_force_foveation_dp
  - _self_

asset_dir: outputs/pi05_data/tcl_foveation_seed42
task_name: tcl_for_pi05
horizon: 32
obs_as_cond: true
vis_rot_image: false

policy:
  router_condition_key: [joint_state, task_id]
  mask_policy_state: false
  router_loss_type: st
  foveation_net:
    input_hw: [256, 256]
    patch_size: 16
    num_levels: 3
    global_level: 0
    router_type: node_aligned_fpn
    global_encoder_type: resnet10
    global_feature_dim: 512
    global_encoder_resize: 64
    router_hidden_dim: 128
    router_cond_dim: 512
    router_temperature: 1.0
    freeze_global_encoder: true
    freeze_router: true
    fix_split_mode: "random:0.0,0.25,0.5,0.75,1.0"
    random_topology_prob: 0.0
    target_num_patches: 0.1
    budget_loss_weight: 0.0

image_shape: &image_shape [3, 256, 256]
foveation_input_hw: [256, 256]
# Replace the inherited observation schema instead of recursively retaining
# force/success from tcl_force_foveation_dp, which this dataset does not emit.
shape_meta: ${pi05_shape_meta}
pi05_shape_meta:
  obs:
    image:
      shape: *image_shape
      type: rgb
    gripper:
      shape: *image_shape
      type: rgb
    joint_state:
      shape: [6]
      type: low_dim
    task_id:
      shape: [10]
      type: low_dim
  action:
    shape: [7]

task:
  dataset:
    _target_: diffusion_policy.dataset.tcl_dataset.TCLFoveationDataset
    output_mode: normalized
    image_resize_wh_ratio: "3:2"
    asset_dir: ${asset_dir}
    data_roots: []
    h5_paths: []
    task_mapping_path: meta/tcl_tasks_10.yaml
    horizon: ${horizon}
    pad_before: 0
    pad_after: 0
    shape_meta: ${shape_meta}
    state_dim: 6
    val_ratio: 0.02
    seed: 42
    stats_seed: 42
    use_h5: true
    temporal_pairing: false
    norm:
      state: quantile
      action: quantile
      force: quantile

  env_runner:
    _target_: diffusion_policy.env_runner.tcl_foveation_video_runner.TCLFoveationVideoRunner
    episodes_per_task: 2
    save_foveation_video: true
    fps: 20
    crf: 22
    foveation_vis_batch_size: 16
    seed: 42

training:
  # Offline recording videos, in epochs; sample_every also uses epochs.
  rollout_every: 50
  reserve_gpu_memory_gb: 0  # Extra fixed GiB per GPU, held outside training computations.
  seed: 42
  num_epochs: 1500
  router_only: false
  temporal_adaptive: false
  budget_lambda_init: 0.0
  budget_lambda_lr: 0.01
  downstream_finetune_start_epoch: null
  target_num_patches_start: null
  target_num_patches_decay_epochs: 600
  use_ema: true

pretrained_ckpt: null
pretrained_ckpt_mode: null
foveation_export_path: null
data_seed_from_ckpt: false
