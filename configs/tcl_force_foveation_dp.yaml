_target_: diffusion_policy.workspace.train_foveation_dp_transformer_workspace.TrainFoveationDPTransformerWorkspace

name: train_foveation_dp_transformer
task_name: tcl_force
horizon: 32
n_obs_steps: 1
n_action_steps: 8
obs_as_cond: true
vis_rot_image: false

checkpoint:
  save_last_ckpt: true
  save_last_snapshot: false
  topk:
    format_str: "epoch={epoch:04d}-val_diffusion_loss={val_diffusion_loss:.6f}.ckpt"
    k: 5
    mode: min
    monitor_key: val_diffusion_loss

dataloader:
  batch_size: 64
  num_workers: 12
  persistent_workers: true
  pin_memory: true
  shuffle: true
val_dataloader:
  batch_size: 4
  num_workers: 4
  persistent_workers: true
  pin_memory: true
  shuffle: false

ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  inv_gamma: 1.0
  max_value: 0.9999
  min_value: 0.0
  power: 0.75
  update_after_step: 0

logging:
  mode: online
  project: diffusion_policy_tcl
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  group: null
  id: null
  tags: ["${name}", "${task_name}"]

optimizer:
  learning_rate: 1.0e-4
  visual_encoder_lr_multiplier: 1.0
  betas: [0.9, 0.95]
  transformer_weight_decay: 0.001
  obs_encoder_weight_decay: 0.01

policy:
  _target_: diffusion_policy.policy.foveation_dp_transformer_policy.FoveationTransformerHybridImagePolicy
  shape_meta: ${shape_meta}
  horizon: ${horizon}
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  obs_as_cond: ${obs_as_cond}
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddim.DDIMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    clip_sample: true
    set_alpha_to_one: true
    steps_offset: 0
    prediction_type: epsilon
  num_inference_steps: 8
  n_layer: 8
  n_head: 4
  n_emb: 256
  n_cond_layers: 0
  p_drop_emb: 0.0
  p_drop_attn: 0.3
  causal_attn: true
  time_as_cond: true
  visual_dim: 256
  router_condition_key: [joint_state, force]
  # Keep force and success conditioning on the action path.
  mask_policy_state: false
  paired_loss_weight: 1.0
  paired_node_sampling: reachable
  router_loss_type: st
  temporal_adaptive: false
  temporal_loss_weight: 1.0  # 0 retains both windows and active matching for ablation.
  pooling_type: cls_token
  patch_level_adapter_channels: 16
  visual_encoder_layers: 4
  visual_encoder_init: trunc_normal  # copy (legacy) or trunc_normal (independent layers)
  visual_encoder_heads: 8
  visual_encoder_dropout: 0.0
  position_encoding_types: [apt_interpolated, level_embedding]
  patch_embedding_type: conv
  foveation_net:
    _target_: diffusion_policy.model.roi.foveation_net.FoveationNet
    in_channels: 3
    input_hw: ${foveation_input_hw}
    # null disables; 32 applies area downsampling to 32x32, then bilinear upsampling.
    debug_lowpass_size: null
    num_levels: 3
    global_level: 0
    router_type: node_aligned_fpn
    global_encoder_type: resnet10
    global_feature_dim: 768
    torch_home: "/home/geyuan/pretrained/torch"
    patch_size: 16
    router_hidden_dim: 128
    router_layers: 4
    router_heads: 8
    router_cond_dim: 512
    freeze_global_encoder: false
    freeze_router: false
    router_temperature: 1.0
    target_num_patches: 0.1
    # Random legal trees are also used during evaluation.
    # Uniform leaves: "level:1". Weighted window sampling (also during eval):
    # ["20%level:0", "25%level:1", "35%level:2", "20%random:0.25,0.5,0.75"]
    # Weights sum to 100%; views/frames share the mode. Requires random_topology_prob=0.
    fix_split_mode: "random:0.0,0.25,0.5,0.75,1.0"
    random_topology_prob: 0.0
    budget_loss_weight: 0.0
    budget_probability_type: sampled_relaxed
    budget_loss_type: per_observation_mse
    budget_base_cost_weight: 0.01
    budget_elu_tau: 0.025

# Resize TCL's 240x320 frames to HxW=256x320?; no policy-side random crop.
# Patch16 / three levels: 20 coarsest to 320 finest leaves per camera.
image_shape: &image_shape [3, 256, 320]
foveation_input_hw: [256, 320]
shape_meta:
  obs:
    image:
      shape: *image_shape
      type: rgb
    gripper:
      shape: *image_shape
      type: rgb
    joint_state:
      shape: [6]
      type: low_dim
    force:
      shape: [6]
      type: low_dim
    success:
      shape: [1]
      type: low_dim
  action:
    shape: [7]

task:
  dataset:
    _target_: diffusion_policy.dataset.tcl_dataset.TCLFoveationDataset
    shape_meta: ${shape_meta}
    horizon: ${horizon}
    pad_before: ${eval:'${n_obs_steps}-1'}
    pad_after: ${eval:'${n_action_steps}-1'}
    max_train_episodes: 90
    # Independent from training.seed; Stage B restores this and the episode lists.
    seed: 42
    val_ratio: 0.02
    data_root: /home/geyuan/datasets/reverse/0209_tower_boby_easy_reversed/
    h5_path: /home/geyuan/datasets/reverse/0209_tower_boby_easy_reversed_240p.h5
    use_h5: true
    norm_force_type: quantile
    zero_force: false
    default_success_label: 1.0
    # CFGRL semantics: drop image, gripper and joint_state together; keep force/success.
    p_cond_drop: 0.3
    p_camera_drop: 0.0
    transform_color_jitter: true

  env_runner:
    _target_: diffusion_policy.env_runner.tcl_foveation_video_runner.TCLFoveationVideoRunner
    max_episodes: null  # All val episodes, each including every frame.
    save_foveation_video: true
    fps: 20  # Playback rate; override to match the recording rate.
    crf: 22
    foveation_vis_batch_size: 16
    seed: 42  # Fixed video sampling, independent of training and split RNG.

training:
  seed: 42
  device: cuda:0
  num_epochs: 1500
  gradient_accumulate_every: 1
  lr_scheduler: cosine
  lr_warmup_steps: 1000
  resume: false
  use_ema: true
  router_only: false
  downstream_finetune_start_epoch: null
  target_num_patches_start: null
  target_num_patches_decay_epochs: 200
  budget_lambda_init: 0.0
  budget_lambda_lr: 0.01
  rollout_every: 50  # Offline full-episode videos; -1 disables.
  distributed_rollout: false
  ddp_timeout_seconds: 10800
  val_every: 25
  checkpoint_every: 50  # Must coincide with validation for top-k selection.
  sample_every: 5
  sample_resample: false
  sample_resolution_advantage: true
  topology_samples_per_task: 64
  max_train_steps: null
  max_val_steps: null
  router_temperature_start: 1.0
  router_temperature_end: 1.0
  router_temperature_steps: 100000
  router_temperature_schedule: constant

pretrained_ckpt: null
pretrained_ckpt_mode: null
reuse_pretrained_dataset_config: false
data_seed_from_ckpt: false
