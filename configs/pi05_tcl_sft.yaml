defaults:
  - runner: pi05_libero
  - _self_
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled

_target_: diffusion_policy.workspace.train_pi05_workspace.TrainPi05Workspace
dataset_type: tcl
base_dir: ${oc.env:PI05_BASE_DIR,${oc.env:HOME}/pretrained/pi05/converted_base}
asset_dir: outputs/pi05_data/tcl_foveation_seed42
resume: null
pretrained_ckpt: null
pretrained_ckpt_mode: latest
foveation_pretrained_path: null
libero_root: ${oc.env:HOME}/code/LIBERO-FT
data_roots: []
h5_paths: []
use_h5: true
task_mapping_path: meta/tcl_tasks_10.yaml
state_dim: 6
dataset_seed: 42
val_ratio: 0.02
stats_seed: 42
stats_max_frames_per_task: 50000

rollout:
  enabled: false
  # Optimizer updates; also schedules offline videos without online rollout.
  every: 1000
  first_step: 0

offline_video:
  enabled: true
  episodes_per_task: 2
  fps: 20
  crf: 22
  foveation_vis_batch_size: 16

runner:
  hdf5_fns: []

model:
  dtype: bfloat16
  action_dim: 32
  action_horizon: 32
  n_action_steps: 24
  max_token_len: 200
  render_image_orientation: raw
  image_size: 224
  visual_input_mode: mixed_foveation
  foveation_patch_size: 14
  foveation_num_levels: 3
  foveation_split_mode: ["40%level:2", "60%random:0.05-0.99"]
  foveation_position_encoding: siglip_multiscale
  foveation_level_embedding: true
  foveation_patch_level_adapter: true
  foveation_patch_level_adapter_channels: 16
  foveation_apt_position_encoding: true
  foveation_random_seed: 42
  foveation_router_type: none
  foveation_global_encoder_type: resnet10
  foveation_global_feature_dim: 512
  foveation_global_encoder_resize: null
  foveation_torch_home: ${oc.env:TORCH_HOME,null}
  foveation_freeze_global_encoder: true
  foveation_router_layers: 4
  foveation_router_hidden_dim: 128
  foveation_router_heads: 8
  foveation_router_cond_dim: 512
  foveation_router_temperature: 1.0
  foveation_target_num_patches: null
  foveation_budget_loss_weight: 0.0
  foveation_budget_loss_type: upper_bound_lagrangian_elu
  foveation_budget_base_cost_weight: 0.0
  foveation_budget_probability_type: sampled_relaxed
  foveation_budget_elu_tau: 0.025
  gradient_checkpointing: true
  attention_backend: math

training:
  stage_b: false
  seed: 42
  global_batch: 128
  micro_batch: 16
  max_steps: 4001
  gradient_clip: 1.0
  log_every: 5
  diagnose_first_update: true
  ddp_timeout_seconds: 3600
  sample_every: 90  # Optimizer updates, not epochs or accumulation micro-steps.
  sample_batch_size: 8
  sample_resample: true
  sample_resolution_advantage: true
  topology_samples_per_task: 32
  sample_diagnostic_batch_size: 8
  downstream_finetune_start_step: null
  target_num_patches_start: null
  target_num_patches_decay_steps: 3000
  paired_loss_weight: 1.0
  temporal_loss_weight: 1.0
  temporal_adaptive: false
  paired_node_sampling: reachable
  pairing_seed: ${training.seed}
  budget_lambda_init: 0.0
  budget_lambda_lr: 0.01

optimizer:
  lr: 5.0e-5
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 1.0e-10
  warmup_steps: 200
ema_decay: 0.999
dataloader:
  # RoboKit keeps an HDF5 handle per source; use the main process unless a
  # server-specific dataset wrapper implements worker-local reopening.
  num_workers: 0
validation:
  every: 1000
  seed: 1042
  batch_size: 1
  max_batches: 32
checkpoint:
  monitor: val_loss
  save_full: true
  full_every: 1500
hydra:
  run:
    dir: ${oc.env:PI05_OUTPUT_DIR,outputs/pi05_tcl/manual}
  output_subdir: null
logging:
  mode: disabled
  project: diffusion_policy_pi05_tcl
  entity: null
  name: null
  group: null
  tags: [pi05, tcl, stageA]

# Raw dataset; policy preprocessing applies this declared contract.
task:
  dataset:
    image_resize_wh_ratio: "3:2"
    norm:
      state: quantile
      action: quantile
      force: quantile
